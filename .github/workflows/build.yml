      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project and fonts
        run: bash tools/prepare_build.sh

      - run: flutter pub get

      - name: Unit tests (geometry)
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk BaghNeshan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BaghNeshan-apk
          path: BaghNeshan.apk

      - name: Publish release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BaghNeshan build ${{ github.run_number }}
          files: BaghNeshan.apk
